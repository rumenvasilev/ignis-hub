version: '3.8'

services:
  terraform-registry:
    build: .
    ports:
      - "8080:8080"
    environment:
      - REGISTRY_AWS_REGION=eu-west-1
      - REGISTRY_AWS_S3_BUCKET=test-roomba-my-terraform-registry
      - REGISTRY_AWS_S3_PREFIX=registry
      # For AWS credentials (required for production; IAM role is not supported yet)
      # - REGISTRY_AWS_ACCESS_KEY_ID= # AWS access key id
      # - REGISTRY_AWS_SECRET_ACCESS_KEY= # AWS secret access key
      # - REGISTRY_AWS_SESSION_TOKEN= # AWS session token
      - REGISTRY_AUTH_ENABLED=false  # Disabled for easy local testing
      # - REGISTRY_AUTH_METHOD=token
      # - REGISTRY_AUTH_TOKEN="your-secret-token-here"
      - REGISTRY_LOG_LEVEL=debug
      - REGISTRY_LOG_FORMAT=text
    restart: unless-stopped
    networks:
      - terraform-registry

networks:
  terraform-registry:
    driver: bridge 

