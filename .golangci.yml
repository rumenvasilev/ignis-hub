run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - gosec
    - gocyclo
    - goconst
    - misspell
    - revive
    - goimports
    - unparam
    - unconvert
    - dupl
    - prealloc
    - copyloopvar

linters-settings:
  gocyclo:
    min-complexity: 15

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  revive:
    confidence: 0.8
    rules:
      - name: exported
        disabled: true

  gosec:
    excludes:
      - G204  # Subprocess launched with variable
      - G304  # File path provided as taint input

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec

    # Exclude known issues
    - text: "weak cryptographic primitive"
      linters:
        - gosec

    # Allow embedding in tests
    - path: _test\.go
      text: "should not use dot imports"

    # Ignore error checks in deferred Close() calls
    - source: "defer.*\\.Close\\(\\)"
      linters:
        - errcheck

output:
  formats:
    text:
      path: stdout
  sort-order:
    - linter
    - file
