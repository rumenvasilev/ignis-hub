name: Build

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.3']
        os: [linux, darwin]
        arch: [amd64, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build server (ignis-hub)
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        CGO_ENABLED: 0
      run: go build -v -ldflags="-s -w" -o ignis-hub-${{ matrix.os }}-${{ matrix.arch }} .

    - name: Build client (ignishubctl)
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        CGO_ENABLED: 0
      run: go build -v -ldflags="-s -w" -o ignishubctl-${{ matrix.os }}-${{ matrix.arch }} ./cmd/ignishubctl

    - name: Upload ignis-hub artifact
      uses: actions/upload-artifact@v4
      with:
        name: ignis-hub-${{ matrix.os }}-${{ matrix.arch }}
        path: ignis-hub-${{ matrix.os }}-${{ matrix.arch }}
        retention-days: 7

    - name: Upload ignishubctl artifact
      uses: actions/upload-artifact@v4
      with:
        name: ignishubctl-${{ matrix.os }}-${{ matrix.arch }}
        path: ignishubctl-${{ matrix.os }}-${{ matrix.arch }}
        retention-days: 7

  docker-dev:
    name: Build and Push Dev Docker Image
    runs-on: ubuntu-latest
    # Only run on branch pushes, NOT on PRs
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Generate dev build version
      id: dev_build_version
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        echo "VERSION=dev-${SHORT_SHA}-${{ github.run_id }}" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/ignis-hub:${{ steps.dev_build_version.outputs.VERSION }}
        build-args: |
          VERSION=${{ steps.dev_build_version.outputs.VERSION }}
        file: Dockerfile
