name: Build

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.3']
        os: [linux, darwin]
        arch: [amd64, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build server (ignis-hub)
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        CGO_ENABLED: 0
      run: go build -v -ldflags="-s -w" -o ignis-hub-${{ matrix.os }}-${{ matrix.arch }} .

    - name: Build client (ignishubctl)
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        CGO_ENABLED: 0
      run: go build -v -ldflags="-s -w" -o ignishubctl-${{ matrix.os }}-${{ matrix.arch }} ./cmd/ignishubctl

    - name: Upload ignis-hub artifact
      uses: actions/upload-artifact@v4
      with:
        name: ignis-hub-${{ matrix.os }}-${{ matrix.arch }}
        path: ignis-hub-${{ matrix.os }}-${{ matrix.arch }}
        retention-days: 7

    - name: Upload ignishubctl artifact
      uses: actions/upload-artifact@v4
      with:
        name: ignishubctl-${{ matrix.os }}-${{ matrix.arch }}
        path: ignishubctl-${{ matrix.os }}-${{ matrix.arch }}
        retention-days: 7

